openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: BR0 PR0 BOT Admin Panel API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: dashboard
    description: Dashboard & statistics
  - name: users
    description: User management (pending & approved)
  - name: media
    description: Media submissions
  - name: broadcasts
    description: Broadcast history
  - name: settings
    description: Bot configuration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Dashboard statistics
      description: Returns overview stats for the admin dashboard
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /pending-users:
    get:
      operationId: listPendingUsers
      tags: [users]
      summary: List pending users
      description: Users who submitted media but await admin approval
      responses:
        "200":
          description: List of pending users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingUser"

  /pending-users/{id}/approve:
    post:
      operationId: approveUser
      tags: [users]
      summary: Approve a pending user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /pending-users/{id}/decline:
    post:
      operationId: declineUser
      tags: [users]
      summary: Decline a pending user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /approved-users:
    get:
      operationId: listApprovedUsers
      tags: [users]
      summary: List approved users
      description: All approved/banned users
      responses:
        "200":
          description: List of approved users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /approved-users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user (ban/unban)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /media:
    get:
      operationId: listMedia
      tags: [media]
      summary: List all media submissions
      description: All photos/videos submitted by all users
      responses:
        "200":
          description: List of media items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaItem"

  /users/{id}/media:
    get:
      operationId: listUserMedia
      tags: [media]
      summary: List media for a specific user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of user's media items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaItem"

  /broadcasts:
    get:
      operationId: listBroadcasts
      tags: [broadcasts]
      summary: List broadcast history
      responses:
        "200":
          description: List of broadcasts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Broadcast"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get bot settings
      responses:
        "200":
          description: Bot settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

    post:
      operationId: updateSettings
      tags: [settings]
      summary: Update bot settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.

  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardStats:
      type: object
      required: [totalUsers, pendingUsers, approvedUsers, bannedUsers, totalMedia, totalBroadcasts]
      properties:
        totalUsers: { type: integer }
        pendingUsers: { type: integer }
        approvedUsers: { type: integer }
        bannedUsers: { type: integer }
        totalMedia: { type: integer }
        totalBroadcasts: { type: integer }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    ActivityItem:
      type: object
      required: [type, message, timestamp]
      properties:
        type: { type: string, enum: [user_joined, user_approved, user_declined, media_submitted, broadcast_sent] }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        userId: { type: ["integer", "null"] }

    PendingUser:
      type: object
      required: [id, telegramId, username, firstName, mediaCount, submittedAt]
      properties:
        id: { type: integer }
        telegramId: { type: string }
        username: { type: ["string", "null"] }
        firstName: { type: string }
        lastName: { type: ["string", "null"] }
        mediaCount: { type: integer }
        isAdmin: { type: boolean }
        submittedAt: { type: string, format: date-time }

    User:
      type: object
      required: [id, telegramId, firstName, status, createdAt]
      properties:
        id: { type: integer }
        telegramId: { type: string }
        username: { type: ["string", "null"] }
        firstName: { type: string }
        lastName: { type: ["string", "null"] }
        status: { type: string, enum: [pending, approved, declined, banned] }
        isAdmin: { type: boolean }
        mediaCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserDetail:
      type: object
      required: [id, telegramId, firstName, status, createdAt]
      properties:
        id: { type: integer }
        telegramId: { type: string }
        username: { type: ["string", "null"] }
        firstName: { type: string }
        lastName: { type: ["string", "null"] }
        status: { type: string, enum: [pending, approved, declined, banned] }
        isAdmin: { type: boolean }
        mediaCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        media:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"

    UserUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, banned] }
        isAdmin: { type: boolean }

    MediaItem:
      type: object
      required: [id, userId, type, telegramFileId, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        type: { type: string, enum: [photo, video] }
        telegramFileId: { type: string }
        caption: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    Broadcast:
      type: object
      required: [id, mediaId, sentCount, failedCount, createdAt]
      properties:
        id: { type: integer }
        mediaId: { type: integer }
        sentCount: { type: integer }
        failedCount: { type: integer }
        createdAt: { type: string, format: date-time }

    Settings:
      type: object
      required: [id, botName, minMediaRequired, createdAt]
      properties:
        id: { type: integer }
        botName: { type: string }
        adminPassword: { type: ["string", "null"] }
        minMediaRequired: { type: integer }
        welcomeMessage: { type: ["string", "null"] }
        approvalMessage: { type: ["string", "null"] }
        declineMessage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SettingsInput:
      type: object
      properties:
        botName: { type: string, minLength: 1 }
        adminPassword: { type: string }
        minMediaRequired: { type: integer, minimum: 1 }
        welcomeMessage: { type: string }
        approvalMessage: { type: string }
        declineMessage: { type: string }

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, 'null'], format: email }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        profileImageUrl: { type: [string, 'null'] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1, format: uri }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
